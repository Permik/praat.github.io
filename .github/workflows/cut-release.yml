name: Cut release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version embedded in the binaries, for example 7.0.04"
        required: true
        type: string
      source_ref:
        description: "Branch, tag, or commit to build"
        required: true
        default: master
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: false
        type: boolean
      draft:
        description: "Create the GitHub release as a draft"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mac
            name: macOS universal
            runs_on: '["self-hosted", "macOS", "xcode"]'
          - id: win-x64v3
            name: Windows x64-v3
            runs_on: '["self-hosted", "Windows", "msys2", "clang64"]'
          - id: win-x64v1
            name: Windows x64-v1
            runs_on: '["self-hosted", "Windows", "msys2", "clang64"]'
          - id: win-arm64
            name: Windows ARM64
            runs_on: '["self-hosted", "Windows", "msys2", "clangarm64"]'
          - id: win-i686
            name: Windows i686
            runs_on: '["self-hosted", "Windows", "msys2", "mingw32"]'
          - id: linux-x64v3
            name: Linux x64-v3
            runs_on: '["ubuntu-24.04"]'
          - id: linux-arm64
            name: Linux ARM64
            runs_on: '["ubuntu-24.04-arm"]'
          - id: linux-s390x
            name: Linux s390x
            runs_on: '["self-hosted", "Linux", "s390x"]'
          - id: linux-s390x-barren
            name: Linux s390x barren
            runs_on: '["self-hosted", "Linux", "s390x"]'
          - id: chrome-x64v1
            name: ChromeOS x64-v1
            runs_on: '["self-hosted", "Linux", "ChromeOS", "x64"]'
          - id: chrome-arm64
            name: ChromeOS ARM64
            runs_on: '["self-hosted", "Linux", "ChromeOS", "arm64"]'
          - id: rpi-armv7
            name: Raspberry Pi ARMv7
            runs_on: '["self-hosted", "Linux", "RaspberryPi", "armv7"]'
          - id: linux-x64v3-barren
            name: Linux x64-v3 barren
            runs_on: '["ubuntu-24.04"]'
          - id: linux-arm64-barren
            name: Linux ARM64 barren
            runs_on: '["ubuntu-24.04-arm"]'

    runs-on: ${{ fromJSON(matrix.runs_on) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Install Linux dependencies
        if: startsWith(matrix.id, 'linux-') && matrix.id != 'linux-s390x' && matrix.id != 'linux-s390x-barren'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ make pkg-config libgtk-3-dev libasound2-dev libpulse-dev libjack-jackd2-dev

      - name: Restore macOS Xcode project
        if: matrix.id == 'mac'
        run: |
          test -d /opt/praat/praat.xcodeproj
          cp -R /opt/praat/praat.xcodeproj .

      - name: Build and package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.id }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([A-Za-z0-9.-]*)$ ]]
          mkdir -p dist
          compact_version="${VERSION//./}"

          case "$TARGET" in
            mac)
              test -d praat.xcodeproj
              xcodebuild -project praat.xcodeproj -target praat_mac -configuration Release \
                -derivedDataPath build/macos \
                CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
              ditto -c -k --sequesterRsrc --keepParent \
                build/macos/Build/Products/Release/Praat.app \
                "dist/praat${compact_version}_mac.zip"
              ;;
            win-x64v3|win-x64v1|win-arm64|win-i686)
              case "$TARGET" in
                win-x64v3) arch=x64v3; suffix=win-x64v3; compiler=clang ;;
                win-x64v1) arch=x64v1; suffix=win-x64v1; compiler=clang ;;
                win-arm64) arch=arm64; suffix=win-arm64; compiler=clang ;;
                win-i686) arch=i686; suffix=win-intel32; compiler=gcc ;;
              esac
              make -j"$(nproc)" PRAAT_OS=windows PRAAT_ARCH="$arch" \
                PRAAT_COMPILER="$compiler"
              test -f Praat.exe
              7z a -tzip "dist/praat${compact_version}_${suffix}.zip" Praat.exe >/dev/null
              ;;
            linux-x64v3|linux-arm64|linux-s390x|chrome-x64v1|chrome-arm64|rpi-armv7)
              case "$TARGET" in
                linux-x64v3) os=linux; arch=x64v3; suffix=linux-x64v3 ;;
                linux-arm64) os=linux; arch=arm64; suffix=linux-arm64 ;;
                linux-s390x) os=linuxone; arch=s390x; suffix=linux-s390x ;;
                chrome-x64v1) os=chrome; arch=x64v1; suffix=chrome-x64v1 ;;
                chrome-arm64) os=chrome; arch=arm64; suffix=chrome-arm64 ;;
                rpi-armv7) os=raspberrypi; arch=native; suffix=rpi-armv7 ;;
              esac
              make -j"$(nproc)" PRAAT_OS="$os" PRAAT_ARCH="$arch"
              test -f praat
              tar -czf "dist/praat${compact_version}_${suffix}.tar.gz" praat
              ;;
            linux-x64v3-barren|linux-arm64-barren|linux-s390x-barren)
              case "$TARGET" in
                linux-x64v3-barren) os=linux; arch=x64v3; suffix=linux-x64v3-barren ;;
                linux-arm64-barren) os=linux; arch=arm64; suffix=linux-arm64-barren ;;
                linux-s390x-barren) os=linuxone; arch=s390x; suffix=linux-s390x-barren ;;
              esac
              make clean
              make -j"$(nproc)" PRAAT_OS="$os" PRAAT_ARCH="$arch" \
                PRAAT_GRAPHICS=barren PRAAT_AUDIO=none
              test -f praat_barren
              tar -czf "dist/praat${compact_version}_${suffix}.tar.gz" praat_barren
              ;;
            *)
              echo "Unsupported release target: $TARGET" >&2
              exit 1
              ;;
          esac

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([A-Za-z0-9.-]*)$ ]]
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 14
          tag="v${VERSION}"
          release_flags=(--generate-notes)
          [[ "$PRERELEASE" == "true" ]] && release_flags+=(--prerelease)
          [[ "$DRAFT" == "true" ]] && release_flags+=(--draft)
          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Praat ${VERSION}" \
            "${release_flags[@]}"
