name: Cut release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version embedded in the binaries, for example 7.0.04"
        required: true
        type: string
      source_ref:
        description: "Branch, tag, or commit to build"
        required: true
        default: master
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: false
        type: boolean
      draft:
        description: "Create the GitHub release as a draft"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mac
            name: macOS universal
            runs_on: '["macos-15"]'
          - id: win-x64v3
            name: Windows x64-v3
            runs_on: '["windows-2022"]'
            msystem: CLANG64
            toolchain: mingw-w64-clang-x86_64-clang
          - id: win-x64v1
            name: Windows x64-v1
            runs_on: '["windows-2022"]'
            msystem: CLANG64
            toolchain: mingw-w64-clang-x86_64-clang
          - id: win-arm64
            name: Windows ARM64
            runs_on: '["windows-11-arm"]'
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-clang
          - id: win-i686
            name: Windows i686
            runs_on: '["windows-2022"]'
            msystem: MINGW32
            toolchain: mingw-w64-i686-gcc
          - id: linux-x64v3
            name: Linux x64-v3
            runs_on: '["ubuntu-24.04"]'
          - id: linux-arm64
            name: Linux ARM64
            runs_on: '["ubuntu-24.04-arm"]'
          - id: linux-x64v3-barren
            name: Linux x64-v3 barren
            runs_on: '["ubuntu-24.04"]'
          - id: linux-arm64-barren
            name: Linux ARM64 barren
            runs_on: '["ubuntu-24.04-arm"]'

    runs-on: ${{ fromJSON(matrix.runs_on) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Install Linux dependencies
        if: startsWith(matrix.id, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ make pkg-config libgtk-3-dev libasound2-dev libpulse-dev libjack-jackd2-dev

      - name: Install Windows toolchain
        if: startsWith(matrix.id, 'win-')
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            make
            p7zip
            ${{ matrix.toolchain }}

      - name: Restore macOS Xcode project
        if: matrix.id == 'mac'
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_REPOSITORY: praat/praat.github.io
        run: |
          gh release download --repo "$PROJECT_REPOSITORY" --pattern '*xcodeproj.zip' --dir .
          project_archive="$(find . -maxdepth 1 -name '*xcodeproj.zip' -print -quit)"
          test -n "$project_archive"
          unzip -q "$project_archive"
          test -d praat.xcodeproj

      - name: Build and package
        if: ${{ !startsWith(matrix.id, 'win-') }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.id }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([A-Za-z0-9.-]*)$ ]]
          mkdir -p dist
          compact_version="${VERSION//./}"

          case "$TARGET" in
            mac)
              test -d praat.xcodeproj
              xcodebuild -project praat.xcodeproj -scheme praat_mac -configuration Release \
                -derivedDataPath build/macos \
                CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
              ditto -c -k --sequesterRsrc --keepParent \
                build/macos/Build/Products/Release/Praat.app \
                "dist/praat${compact_version}_mac.zip"
              ;;
            linux-x64v3|linux-arm64)
              case "$TARGET" in
                linux-x64v3) os=linux; arch=x64v3; suffix=linux-x64v3 ;;
                linux-arm64) os=linux; arch=arm64; suffix=linux-arm64 ;;
              esac
              make -j"$(nproc)" PRAAT_OS="$os" PRAAT_ARCH="$arch"
              test -f praat
              tar -czf "dist/praat${compact_version}_${suffix}.tar.gz" praat
              ;;
            linux-x64v3-barren|linux-arm64-barren)
              case "$TARGET" in
                linux-x64v3-barren) os=linux; arch=x64v3; suffix=linux-x64v3-barren ;;
                linux-arm64-barren) os=linux; arch=arm64; suffix=linux-arm64-barren ;;
              esac
              make clean
              make -j"$(nproc)" PRAAT_OS="$os" PRAAT_ARCH="$arch" \
                PRAAT_GRAPHICS=barren PRAAT_AUDIO=none
              test -f praat_barren
              tar -czf "dist/praat${compact_version}_${suffix}.tar.gz" praat_barren
              ;;
            *)
              echo "Unsupported release target: $TARGET" >&2
              exit 1
              ;;
          esac

      - name: Build and package on Windows
        if: ${{ startsWith(matrix.id, 'win-') }}
        shell: msys2 {0}
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.id }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([A-Za-z0-9.-]*)$ ]]
          mkdir -p dist
          compact_version="${VERSION//./}"

          case "$TARGET" in
            win-x64v3|win-x64v1|win-arm64|win-i686)
              case "$TARGET" in
                win-x64v3) arch=x64v3; suffix=win-x64v3; compiler=clang ;;
                win-x64v1) arch=x64v1; suffix=win-x64v1; compiler=clang ;;
                win-arm64) arch=arm64; suffix=win-arm64; compiler=clang ;;
                win-i686) arch=i686; suffix=win-intel32; compiler=gcc ;;
              esac
              make -j"$(nproc)" PRAAT_OS=windows PRAAT_ARCH="$arch" \
                PRAAT_COMPILER="$compiler"
              test -f Praat.exe
              7z a -tzip "dist/praat${compact_version}_${suffix}.zip" Praat.exe >/dev/null
              ;;
            *)
              echo "Unsupported release target: $TARGET" >&2
              exit 1
              ;;
          esac

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([A-Za-z0-9.-]*)$ ]]
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 9
          tag="v${VERSION}"
          release_flags=(--generate-notes)
          [[ "$PRERELEASE" == "true" ]] && release_flags+=(--prerelease)
          [[ "$DRAFT" == "true" ]] && release_flags+=(--draft)
          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Praat ${VERSION}" \
            "${release_flags[@]}"
